name: Release package

on:
    workflow_dispatch:
        inputs:
            package:
                description: 'Package to release'
                required: true
                type: choice
                options:
                    - roots
                    - roots-v2
                default: roots
            release-type:
                description: 'Release type (one of): patch, minor, major, prepatch, preminor, premajor, prerelease'
                required: true

permissions:
    contents: write
    pull-requests: write
    packages: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            # Setup Node.js environment (registry auth is configured per-package below)
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20

            # Setup Bun
            - name: Setup Bun
              uses: oven-sh/setup-bun@v1
              with:
                  bun-version: latest

            # Install dependencies using Bun
            - name: Install dependencies
              run: bun install

            # Run build using Bun
            - name: Run build
              run: bun run build

            # Resolve which package.json/registry/tag this run targets
            - name: Resolve release target
              id: target
              run: |
                  if [ "${{ github.event.inputs.package }}" = "roots-v2" ]; then
                    echo "pkg_dir=v2" >> "$GITHUB_OUTPUT"
                    echo "tag_prefix=v2-" >> "$GITHUB_OUTPUT"
                    echo "npm_access=restricted" >> "$GITHUB_OUTPUT"
                    echo "update_changelog=false" >> "$GITHUB_OUTPUT"
                  else
                    echo "pkg_dir=." >> "$GITHUB_OUTPUT"
                    echo "tag_prefix=" >> "$GITHUB_OUTPUT"
                    echo "npm_access=public" >> "$GITHUB_OUTPUT"
                    echo "update_changelog=true" >> "$GITHUB_OUTPUT"
                  fi

            # Git configuration
            - name: Git configuration
              run: |
                  git config --global user.email "pradeep@banyancloud.io"
                  git config --global user.name "PDP-Banyan"

            # Bump release version
            - name: Bump release version
              if: startsWith(github.event.inputs.release-type, 'pre') != true
              run: |
                  echo "NEW_VERSION=$(npm --no-git-tag-version version $RELEASE_TYPE --prefix "$PKG_DIR")" >> $GITHUB_ENV
                  echo "RELEASE_TAG=latest" >> $GITHUB_ENV
              env:
                  RELEASE_TYPE: ${{ github.event.inputs.release-type }}
                  PKG_DIR: ${{ steps.target.outputs.pkg_dir }}

            # Bump pre-release version
            - name: Bump pre-release version
              if: startsWith(github.event.inputs.release-type, 'pre')
              run: |
                  echo "NEW_VERSION=$(npm --no-git-tag-version --preid=beta version $RELEASE_TYPE --prefix "$PKG_DIR")" >> $GITHUB_ENV
                  echo "RELEASE_TAG=beta" >> $GITHUB_ENV
              env:
                  RELEASE_TYPE: ${{ github.event.inputs.release-type }}
                  PKG_DIR: ${{ steps.target.outputs.pkg_dir }}

            # Update changelog (npmjs release only)
            - name: Update changelog
              if: steps.target.outputs.update_changelog == 'true'
              uses: superfaceai/release-changelog-action@v1
              with:
                  path-to-changelog: CHANGELOG.md
                  version: ${{ env.NEW_VERSION }}
                  operation: release

            # Commit changes
            - name: Commit package.json (and CHANGELOG.md) changes and create tag
              run: |
                  git add "${{ steps.target.outputs.pkg_dir }}/package.json"
                  if [ "${{ steps.target.outputs.update_changelog }}" = "true" ]; then
                    git add "CHANGELOG.md"
                  fi
                  git commit -m "chore: release ${{ steps.target.outputs.tag_prefix }}${{ env.NEW_VERSION }}"
                  git tag "${{ steps.target.outputs.tag_prefix }}${{ env.NEW_VERSION }}"

            # Configure registry credentials for the resolved target
            - name: Configure npm registry
              run: |
                  if [ "${{ github.event.inputs.package }}" = "roots-v2" ]; then
                    echo "@banyandata-cloud:registry=https://npm.pkg.github.com" >> ~/.npmrc
                    echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> ~/.npmrc
                  else
                    echo "//registry.npmjs.org/:_authToken=${{ secrets.NPMJS_ACCESS_TOKEN }}" >> ~/.npmrc
                  fi

            # Publish version
            - name: Publish
              working-directory: ${{ steps.target.outputs.pkg_dir }}
              run: npm publish --verbose --access ${{ steps.target.outputs.npm_access }} --tag ${{ env.RELEASE_TAG }}

            # Push repository changes
            - name: Push changes to repository
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  git push origin main:actions && git push origin main:actions --tags

            # Create Pull Request
            - name: Create Pull Request
              id: npm-publish
              uses: peter-evans/create-pull-request@v4
              with:
                  commit-message: npm publish - open PR - added tag
                  title: npm publish - open PR
                  body: npm publish - open PR
                  base: main
                  labels: automated-pr, npm publish
                  branch: actions
                  delete-branch: true

            # Auto approve PR
            - name: Auto approve
              uses: juliangruber/approve-pull-request-action@v1
              with:
                  github-token: ${{ secrets.PDP_ACC }}
                  number: ${{ steps.npm-publish.outputs.pull-request-number }}

            # Auto merge PR
            - name: Auto merge PR
              uses: juliangruber/merge-pull-request-action@v1
              with:
                  github-token: ${{ secrets.PDP_ACC }}
                  number: ${{ steps.npm-publish.outputs.pull-request-number }}
                  method: squash

            # Get changelog (npmjs release only)
            - id: get-changelog
              name: Get version changelog
              if: steps.target.outputs.update_changelog == 'true'
              uses: superfaceai/release-changelog-action@v1
              with:
                  path-to-changelog: CHANGELOG.md
                  version: ${{ env.NEW_VERSION }}
                  operation: read

            # Update GitHub release
            - name: Update GitHub release documentation
              if: steps.target.outputs.update_changelog == 'true'
              uses: softprops/action-gh-release@v1
              with:
                  tag_name: ${{ steps.target.outputs.tag_prefix }}${{ env.NEW_VERSION }}
                  body: ${{ steps.get-changelog.outputs.changelog }}
                  prerelease: ${{ startsWith(github.event.inputs.release-type, 'pre') }}
                  generate_release_notes: true
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
